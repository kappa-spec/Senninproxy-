<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Sennin Browser</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; color: #00ffcc; font-family: sans-serif; overflow: hidden; }
        .nav { height: 50px; background: #111; display: flex; align-items: center; padding: 0 15px; gap: 10px; border-bottom: 2px solid #00ffcc; }
        input { flex: 1; background: #000; border: 1px solid #00ffcc; color: #fff; padding: 8px 15px; border-radius: 20px; outline: none; }
        #view { height: calc(100% - 50px); width: 100%; background: #fff; }
        iframe { width: 100%; height: 100%; border: none; }
        #overlay { position: fixed; top: 50px; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 10; }
    </style>
</head>
<body>
    <div class="nav">
        <button onclick="location.reload()" style="background:none; border:none; color:#00ffcc; cursor:pointer;">🔄</button>
        <input id="addr" type="text" placeholder="URLまたは検索キーワードを入力...">
        <button onclick="cloak()" style="background:none; border:none; color:#00ffcc; cursor:pointer;">🛡️ 偽装</button>
    </div>
    <div id="overlay">接続を確立しています...</div>
    <div id="view"><iframe id="ifr"></iframe></div>

    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv/uv.config.js"></script>
    <script>
        const addr = document.getElementById('addr');
        const ifr = document.getElementById('ifr');
        const overlay = document.getElementById('overlay');

        async function startEngine() {
            const reg = await navigator.serviceWorker.register('/sw.js', { scope: __uv$config.prefix });
            // Service Workerが完全にアクティブになるまで待機(重要)
            while (!reg.active) {
                await new Promise(r => setTimeout(r, 100));
            }
            return reg;
        }

        async function go(val) {
            overlay.style.display = 'flex';
            await startEngine();
            let url = val.trim();
            
            if (!url.includes('.') || url.includes(' ')) {
                const res = await fetch(`/api/search?q=${encodeURIComponent(url)}`);
                const data = await res.json();
                url = data.url;
            } else if (!url.startsWith('http')) {
                url = 'https://' + url;
            }
            
            ifr.src = __uv$config.prefix + __uv$config.encodeUrl(url);
            ifr.onload = () => overlay.style.display = 'none';
        }

        addr.onkeydown = e => { if(e.key === 'Enter') go(addr.value); };

        function cloak() {
            const win = window.open('about:blank', '_blank');
            if (!win) return alert('Pop-up blocked');
            const d = win.document;
            const f = d.createElement('iframe');
            Object.assign(f.style, { position:'fixed', top:0, left:0, width:'100%', height:'100%', border:'none' });
            f.src = ifr.src || (location.origin + __uv$config.prefix + __uv$config.encodeUrl('https://duckduckgo.com'));
            d.body.appendChild(f);
            location.replace('https://google.com');
        }
        
        // 起動時にSWを事前登録
        startEngine();
    </script>
</body>
</html>
