<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>New Tab</title>
    <style>
        :root { --chrome-bg: #dee1e6; --toolbar: #ffffff; --border: #cacdd1; --address-bar: #f1f3f4; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--chrome-bg); overflow: hidden; display: flex; flex-direction: column; }
        
        /* Tabs Area */
        .tabs { display: flex; align-items: flex-end; padding: 8px 10px 0; gap: 4px; height: 32px; background: var(--chrome-bg); }
        .tab { background: var(--chrome-bg); width: 200px; height: 32px; border-radius: 8px 8px 0 0; display: flex; align-items: center; padding: 0 12px; font-size: 12px; color: #3c4043; position: relative; }
        .tab.active { background: var(--toolbar); }
        
        /* Toolbar */
        .toolbar { background: var(--toolbar); height: 44px; display: flex; align-items: center; padding: 0 10px; gap: 12px; border-bottom: 1px solid var(--border); }
        .nav-btn { background: none; border: none; font-size: 18px; color: #5f6368; cursor: pointer; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .nav-btn:hover { background: #f1f3f4; }
        
        .address-bar { flex: 1; height: 28px; background: var(--address-bar); border-radius: 14px; display: flex; align-items: center; padding: 0 15px; border: 1px solid transparent; }
        .address-bar:focus-within { background: #fff; border: 1px solid #1a73e8; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        #addr { width: 100%; border: none; background: transparent; outline: none; font-size: 14px; color: #3c4043; }

        /* Content Area */
        #viewport-container { flex: 1; width: 100%; background: #fff; position: relative; }
        #ifr { width: 100%; height: 100%; border: none; display: none; }
        
        /* Home Screen */
        #home-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fff; }
        .google-logo { font-size: 80px; font-weight: bold; margin-bottom: 30px; letter-spacing: -3px; }
        .google-logo span:nth-child(1) { color: #4285f4; }
        .google-logo span:nth-child(2) { color: #ea4335; }
        .google-logo span:nth-child(3) { color: #fbbc05; }
        .google-logo span:nth-child(4) { color: #4285f4; }
        .google-logo span:nth-child(5) { color: #34a853; }
        .google-logo span:nth-child(6) { color: #ea4335; }
        
        /* Loader */
        #loader { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 10; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #4285f4; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="tabs">
        <div class="tab active" id="tab-label">New Tab</div>
    </div>

    <div class="toolbar">
        <button class="nav-btn" onclick="ifr.contentWindow.history.back()">←</button>
        <button class="nav-btn" onclick="ifr.contentWindow.history.forward()">→</button>
        <button class="nav-btn" onclick="ifr.contentWindow.location.reload()">↻</button>
        <button class="nav-btn" onclick="goHome()">🏠</button>
        <div class="address-bar">
            <input id="addr" type="text" placeholder="Search Google or type a URL" autocomplete="off">
        </div>
        <button class="nav-btn" onclick="cloak()">🛡️</button>
    </div>

    <div id="viewport-container">
        <div id="loader">
            <div class="spinner"></div>
            <p id="status-msg">Connecting...</p>
        </div>
        
        <div id="home-screen">
            <div class="google-logo">
                <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
            </div>
            <div id="init-status" style="color:#5f6368; font-size:13px;">Initializing engine...</div>
        </div>

        <iframe id="ifr"></iframe>
    </div>

    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv/uv.config.js"></script>
    <script>
        const ifr = document.getElementById('ifr');
        const addr = document.getElementById('addr');
        const loader = document.getElementById('loader');
        const home = document.getElementById('home-screen');
        const tabLabel = document.getElementById('tab-label');
        const initStatus = document.getElementById('init-status');

        // Service Workerの登録と待機ロジック
        async function registerSW() {
            try {
                const reg = await navigator.serviceWorker.register('/sw.js', { scope: __uv$config.prefix });
                // アクティブになるまで待機
                while (!reg.active) {
                    await new Promise(r => setTimeout(r, 100));
                }
                initStatus.innerText = "Engine Ready";
                return true;
            } catch (e) {
                initStatus.innerText = "Engine Error: " + e.message;
                return false;
            }
        }

        async function launch(val) {
            loader.style.display = 'flex';
            const ready = await registerSW();
            if (!ready) return;

            let url = val.trim();
            if (!url.includes('.') || url.includes(' ')) {
                // 検索APIを利用
                try {
                    const res = await fetch(`/api/search?q=${encodeURIComponent(url)}`);
                    const data = await res.json();
                    url = data.url;
                } catch(e) {
                    url = `https://www.google.com/search?q=${encodeURIComponent(url)}`;
                }
            } else if (!url.startsWith('http')) {
                url = 'https://' + url;
            }

            home.style.display = 'none';
            ifr.style.display = 'block';
            ifr.src = __uv$config.prefix + __uv$config.encodeUrl(url);
            
            ifr.onload = () => {
                loader.style.display = 'none';
                tabLabel.innerText = "Browsing...";
            };
        }

        addr.onkeydown = e => { if(e.key === 'Enter') launch(addr.value); };

        function goHome() {
            ifr.style.display = 'none';
            ifr.src = 'about:blank';
            home.style.display = 'flex';
            addr.value = '';
            tabLabel.innerText = 'New Tab';
        }

        function cloak() {
            const win = window.open('about:blank', '_blank');
            if (!win) return alert('Pop-up blocked!');
            const f = win.document.createElement('iframe');
            Object.assign(f.style, { position:'fixed', top:0, left:0, width:'100%', height:'100%', border:'none' });
            f.src = ifr.src || (window.location.origin + __uv$config.prefix + __uv$config.encodeUrl('https://google.com'));
            win.document.body.appendChild(f);
            window.location.replace('https://classroom.google.com'); // 元のタブを偽装
        }

        // ページ読み込み時にエンジン準備
        registerSW();
    </script>
</body>
</html>
