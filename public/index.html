<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SenninProxy</title>
    <style>
        body { background: #000; color: #00ffcc; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { text-align: center; width: 100%; max-width: 500px; }
        input { width: 100%; padding: 15px; border-radius: 25px; border: 2px solid #00ffcc; background: #111; color: #fff; outline: none; font-size: 1rem; }
        .btns { margin-top: 20px; }
        button { padding: 10px 20px; background: #00ffcc; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SENNIN PROXY</h1>
        <form id="uv-form">
            <input id="uv-address" type="text" placeholder="URLまたは検索ワード..." autocomplete="off">
            <div class="btns">
                <button type="submit">起動</button>
                <button type="button" id="cloak">偽装モード</button>
            </div>
        </form>
    </div>

    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv/uv.config.js"></script>
    <script>
        const form = document.getElementById('uv-form');
        const address = document.getElementById('uv-address');

        async function registerSW() {
            await navigator.serviceWorker.register('/sw.js', { scope: __uv$config.prefix });
        }

        async function getUrl() {
            let url = address.value.trim();
            if (!url.includes('.') || url.includes(' ')) {
                const res = await fetch(`/api/search?q=${encodeURIComponent(url)}`);
                const data = await res.json();
                url = data.url;
            } else if (!url.startsWith('http')) {
                url = 'https://' + url;
            }
            return __uv$config.prefix + __uv$config.encodeUrl(url);
        }

        form.onsubmit = async (e) => {
            e.preventDefault();
            await registerSW();
            location.href = await getUrl();
        };

        document.getElementById('cloak').onclick = async () => {
            await registerSW();
            const url = window.location.origin + await getUrl();
            const win = window.open();
            if (!win) return alert('ポップアップをブロック解除してください');
            win.document.body.innerHTML = `<iframe src="${url}" style="width:100%;height:100%;border:none;position:fixed;top:0;left:0;"></iframe>`;
            location.replace('https://duckduckgo.com');
        };
    </script>
</body>
</html>
