<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sennin Browser</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        .toolbar { height: 55px; background: #1a1a1a; display: flex; align-items: center; padding: 0 15px; gap: 10px; border-bottom: 2px solid #00ffcc; }
        .nav-controls { display: flex; gap: 5px; }
        .btn { background: #333; border: 1px solid #444; color: #00ffcc; padding: 6px 12px; cursor: pointer; border-radius: 4px; transition: 0.2s; }
        .btn:hover { background: #00ffcc; color: #000; }
        .address-container { flex: 1; position: relative; }
        #address-bar { width: 100%; background: #000; border: 1px solid #00ffcc; color: #fff; padding: 8px 15px; border-radius: 20px; outline: none; box-sizing: border-box; }
        #view-container { height: calc(100% - 55px); width: 100%; background: #fff; }
        iframe { width: 100%; height: 100%; border: none; }
        #loader { position: fixed; top: 55px; left: 0; width: 100%; height: 3px; background: #00ffcc; display: none; }
    </style>
</head>
<body>
    <div class="toolbar">
        <div class="nav-controls">
            <button class="btn" onclick="goHome()">🏠</button>
            <button class="btn" onclick="historyBack()">⬅️</button>
            <button class="btn" onclick="reloadFrame()">🔄</button>
        </div>
        <div class="address-container">
            <input id="address-bar" type="text" placeholder="URLまたは検索キーワードを入力...">
        </div>
        <button class="btn" onclick="openAboutBlank()">🛡️ 偽装</button>
    </div>
    <div id="loader"></div>
    <div id="view-container">
        <iframe id="content-frame"></iframe>
    </div>

    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv/uv.config.js"></script>
    <script>
        const addrBar = document.getElementById('address-bar');
        const frame = document.getElementById('content-frame');
        const loader = document.getElementById('loader');

        async function initSW() {
            const reg = await navigator.serviceWorker.register('/sw.js', { scope: __uv$config.prefix });
            while (!reg.active) await new Promise(res => setTimeout(res, 50));
            return reg;
        }

        async function navigate(input) {
            loader.style.display = 'block';
            await initSW();
            let url = input.trim();
            
            if (!url.includes('.') || url.includes(' ')) {
                const res = await fetch(`/api/search?q=${encodeURIComponent(url)}`);
                const data = await res.json();
                url = data.url;
            } else if (!url.startsWith('http')) {
                url = 'https://' + url;
            }

            frame.src = __uv$config.prefix + __uv$config.encodeUrl(url);
            frame.onload = () => { loader.style.display = 'none'; };
        }

        addrBar.onkeydown = (e) => { if(e.key === 'Enter') navigate(addrBar.value); };
        function goHome() { frame.src = 'about:blank'; addrBar.value = ''; }
        function historyBack() { try { frame.contentWindow.history.back(); } catch(e) {} }
        function reloadFrame() { frame.contentWindow.location.reload(); }
        
        async function openAboutBlank() {
            const currentUrl = frame.src || (window.location.origin + __uv$config.prefix + __uv$config.encodeUrl('https://duckduckgo.com'));
            const win = window.open('about:blank', '_blank');
            if (!win) return alert('ポップアップを許可してください');
            const doc = win.document;
            const iframe = doc.createElement('iframe');
            Object.assign(iframe.style, { position:'fixed', top:0, left:0, width:'100%', height:'100%', border:'none' });
            iframe.src = currentUrl;
            doc.body.appendChild(iframe);
            location.replace('https://google.com');
        }
    </script>
</body>
</html>
